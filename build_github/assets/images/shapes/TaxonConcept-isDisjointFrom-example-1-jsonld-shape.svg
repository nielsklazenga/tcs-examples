<g id="node7" class="node">
<title>lit_b1_comment_1</title>
<path fill="#ffffff" stroke="#b0bec5" d="M855.51,-118C855.51,-118 657.51,-118 657.51,-118 651.51,-118 645.51,-112 645.51,-106 645.51,-106 645.51,-12 645.51,-12 645.51,-6 651.51,0 657.51,0 657.51,0 855.51,0 855.51,0 861.51,0 867.51,-6 867.51,-12 867.51,-12 867.51,-106 867.51,-106 867.51,-112 861.51,-118 855.51,-118"/>
<text text-anchor="start" x="653.51" y="-106" font-family="Arial,Helvetica" font-size="10.00">Mit dem Taxon in Mönkemeyer ist der</text>
<text text-anchor="start" x="653.51" y="-95" font-family="Arial,Helvetica" font-size="10.00">Beschreibung nach eindeutig *C. pilifer Brid.</text>
<text text-anchor="start" x="653.51" y="-84" font-family="Arial,Helvetica" font-size="10.00">(C. polytrichoides De Not.), eine</text>
<text text-anchor="start" x="653.51" y="-73" font-family="Arial,Helvetica" font-size="10.00">ozeanisch&#45;submediterrane Art, gemeint. In</text>
<text text-anchor="start" x="653.51" y="-62" font-family="Arial,Helvetica" font-size="10.00">älteren Floren wird C. introflexus, bevor</text>
<text text-anchor="start" x="653.51" y="-51" font-family="Arial,Helvetica" font-size="10.00">diese Art von Störmer (1958) für Europa</text>
<text text-anchor="start" x="653.51" y="-40" font-family="Arial,Helvetica" font-size="10.00">nachgewiesen wurde, regelmäßig als Synonym</text>
<text text-anchor="start" x="653.51" y="-29" font-family="Arial,Helvetica" font-size="10.00">von C. polytrichoides aufgeführt oder in</text>
<text text-anchor="start" x="653.51" y="-18" font-family="Arial,Helvetica" font-size="10.00">diesem Sinne verwendet (vgl. u. a. Demaret &amp;</text>
<text text-anchor="start" x="653.51" y="-7" font-family="Arial,Helvetica" font-size="10.00">Castagne 1961: 203)</text>
</g>
