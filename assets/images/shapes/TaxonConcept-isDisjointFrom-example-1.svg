<!-- lit_b1_comment_sqg5b -->
<g id="node7" class="node">
<title>lit_b1_comment_sqg5b</title>
<path fill="#ffffff" stroke="#b0bec5" d="M838.51,-129C838.51,-129 661.51,-129 661.51,-129 655.51,-129 649.51,-123 649.51,-117 649.51,-117 649.51,-12 649.51,-12 649.51,-6 655.51,0 661.51,0 661.51,0 838.51,0 838.51,0 844.51,0 850.51,-6 850.51,-12 850.51,-12 850.51,-117 850.51,-117 850.51,-123 844.51,-129 838.51,-129"/>
<text text-anchor="start" x="657.51" y="-117" font-family="Arial,Helvetica" font-size="10.00">Mit dem Taxon in Mönkemeyer ist der</text>
<text text-anchor="start" x="657.51" y="-106" font-family="Arial,Helvetica" font-size="10.00">Beschreibung nach eindeutig *C. pilifer</text>
<text text-anchor="start" x="657.51" y="-95" font-family="Arial,Helvetica" font-size="10.00">Brid. (C. polytrichoides De Not.), eine</text>
<text text-anchor="start" x="657.51" y="-84" font-family="Arial,Helvetica" font-size="10.00">ozeanisch&#45;submediterrane Art, gemeint.</text>
<text text-anchor="start" x="657.51" y="-73" font-family="Arial,Helvetica" font-size="10.00">In älteren Floren wird C. introflexus,</text>
<text text-anchor="start" x="657.51" y="-62" font-family="Arial,Helvetica" font-size="10.00">bevor diese Art von Störmer (1958) für</text>
<text text-anchor="start" x="657.51" y="-51" font-family="Arial,Helvetica" font-size="10.00">Europa nachgewiesen wurde, regelmäßig</text>
<text text-anchor="start" x="657.51" y="-40" font-family="Arial,Helvetica" font-size="10.00">als Synonym von C. polytrichoides</text>
<text text-anchor="start" x="657.51" y="-29" font-family="Arial,Helvetica" font-size="10.00">aufgeführt oder in diesem Sinne</text>
<text text-anchor="start" x="657.51" y="-18" font-family="Arial,Helvetica" font-size="10.00">verwendet (vgl. u. a. Demaret &amp; Castagne</text>
<text text-anchor="start" x="657.51" y="-7" font-family="Arial,Helvetica" font-size="10.00">1961: 203)</text>
</g>
